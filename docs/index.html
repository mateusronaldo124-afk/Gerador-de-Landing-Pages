<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Criador de Landing Pages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>

<body>
    <p class="etiqueta">Gerador com inteligência Artificial</p>

    <h1>
        Crie sua Página
        <br>
        <span>com um prompt</span>
    </h1>

    <p class="subtitulo">Descreva o seu negócio e veja a IA criar uma página profissional em segundos</p>

    <div class="caixa-entrada">
        <textarea class="texto-pagina" placeholder="Descreva seu negócio. Ex: Cafeteria, Mercado, etc."></textarea>

        <button onclick="gerarCodigo()">Gerar⚡</button>
    </div>

    <div class="caixa-resultado">

        <p class="bloco-codigo"></p>

        <iframe class="bloco-site"></iframe>

    </div>

    <script src="scripts.js"></script>
</body>

</html>
